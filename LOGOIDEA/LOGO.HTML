<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stoneline Data — Logo Concept</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400&family=Geist:wght@800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;             /* From your original CSS */
      --accent-blue: #4f9cf9;    /* From your original CSS */
      --text: #f0f0f0;           /* From your original CSS */
      --slab-bg: #161616;
      --border: #2a2a2a;         /* From your original CSS */
    }

    body {
      background-color: var(--bg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: 'Geist', sans-serif;
    }

    /* THE LOGO COMPONENT */
    .stoneline-brand {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(145deg, #0f0f0f, #0a0a0a);
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .logo-mark {
      position: relative;
      width: 40px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* The "Stone" - Isometric Monolith */
    .stone-slab {
      width: 32px;
      height: 40px;
      background: var(--slab-bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      /* Subtle isometric tilt to suggest structure and accountability */
      transform: perspective(500px) rotateY(-15deg); 
    }

    /* The "Line" - Neon Core */
    .neon-line {
      position: absolute;
      width: 2px;
      height: 120%;
      background: var(--accent-blue);
      left: 50%;
      top: -10%;
      transform: translateX(-50%);
      z-index: 2;
      /* Signature Neon-tech bloom effect */
      box-shadow: 
        0 0 10px var(--accent-blue),
        0 0 20px rgba(79, 156, 249, 0.6),
        0 0 40px rgba(79, 156, 249, 0.2);
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
      user-select: none;
    }

    .text-top {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--text);
      line-height: 1;
      text-transform: uppercase;
    }

    .text-bottom {
      font-family: 'Geist Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 5.5px; /* High tracking for that tech look */
      color: var(--accent-blue);
      text-transform: uppercase;
      margin-top: 4px;
      opacity: 0.9;
    }

    /* LABEL FOR VIEWING */
    .preview-label {
      margin-top: 40px;
      color: #555;
      font-size: 12px;
      font-family: 'Geist Mono', monospace;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
  </style>
</head>
<body>

  <div class="stoneline-brand">
    <div class="logo-mark">
      <div class="stone-slab"></div>
      <div class="neon-line"></div>
    </div>
    <div class="logo-text">
      <span class="text-top">Stoneline</span>
      <span class="text-bottom">Data</span>
    </div>
  </div>

  <div class="preview-label">Stoneline Data Brand Component v1.0</div>

</body>
</html>
